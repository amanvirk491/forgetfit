<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101511">
<title>ForgeFit — Personal Fitness Tracker</title>
<style>
:root{--bg:#0c100d;--panel:#141b16;--panel2:#1a241d;--line:#29362c;--text:#edf5ee;--muted:#9cad9f;--accent:#b8f36b;--accent2:#d6ff9f;--red:#ff7777;--yellow:#f3d26b;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#1b2a1d 0,transparent 42%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1450px;margin:auto;padding:20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#101610;display:grid;place-items:center;font-weight:1000;font-size:22px}.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:12px;font-weight:700;font-size:13px}.btn:hover{filter:brightness(1.12)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#152012}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}.sidebar{align-self:start;position:sticky;top:16px;background:rgba(20,27,22,.88);border:1px solid var(--line);border-radius:var(--radius);padding:10px}.navbtn{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:12px;border-radius:11px;font-weight:700;margin:2px 0}.navbtn.active,.navbtn:hover{background:var(--panel2);color:var(--accent)}.navbtn span{display:inline-block;width:25px}.side-note{font-size:11px;color:var(--muted);padding:14px 10px 6px;border-top:1px solid var(--line);margin-top:10px}
main{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:2px 0 18px}.pagehead h2{font-size:27px;letter-spacing:-.8px;margin:0}.pagehead p{color:var(--muted);margin:4px 0 0;font-size:13px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--accent);font-weight:900;text-transform:uppercase}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:linear-gradient(145deg,rgba(25,35,28,.98),rgba(17,23,19,.98));border:1px solid var(--line);border-radius:var(--radius);padding:17px;min-width:0}.statlabel{color:var(--muted);font-size:12px;font-weight:650}.statvalue{font-size:27px;font-weight:850;letter-spacing:-.8px;margin:8px 0 4px}.statfoot{font-size:11px;color:var(--muted)}.staticon{float:right;font-size:18px;color:var(--accent)}
.two{grid-template-columns:1.15fr .85fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:13px}.sectiontitle h3{margin:0;font-size:15px}.sectiontitle small{color:var(--muted)}.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:14px}.quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:13px;padding:14px;text-align:left}.quick b{display:block;margin-bottom:4px}.quick small{color:var(--muted)}
.itemlist{display:grid;gap:9px}.listitem{display:flex;gap:12px;align-items:center;background:#111713;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0}.thumb{width:52px;height:52px;flex-shrink:0;border-radius:11px;background:#263329;display:grid;place-items:center;overflow:hidden;color:var(--accent);font-size:22px}.thumb img{width:100%;height:100%;object-fit:cover}.itemmain{min-width:0;flex:1}.itemmain b{display:block;font-size:13px;overflow-wrap:anywhere}.itemmain small{display:block;color:var(--muted);font-size:11px;margin-top:3px;overflow-wrap:anywhere}.itemactions{display:flex;gap:5px;flex-wrap:wrap;justify-content:end}.pill{font-size:10px;font-weight:800;color:var(--accent);background:#293b25;border-radius:99px;padding:4px 8px;white-space:nowrap}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;min-width:0;background:#0e140f;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:11px}input[type=file]{padding:8px;font-size:12px}input[type=checkbox]{width:auto;accent-color:var(--accent)}textarea{resize:vertical;min-height:75px}.field{min-width:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid .full{grid-column:1/-1}.form-actions{display:flex;gap:8px;justify-content:end;flex-wrap:wrap;margin-top:14px}.hint{font-size:11px;color:var(--muted);margin-top:5px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-weight:700}td{color:#e4ece5}td input{min-width:62px;padding:7px;border-radius:8px}.setrow{display:grid;grid-template-columns:38px repeat(3,minmax(0,1fr)) 36px;gap:7px;align-items:center;margin:7px 0}.setrow .setnum{font-size:12px;color:var(--muted);text-align:center}.setrow input{padding:9px 7px;text-align:center}.remove-set{border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--red);padding:7px}.chartbox{height:230px;position:relative}.chartbox canvas{width:100%;height:100%;display:block}.barlist{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:90px minmax(0,1fr) 45px;gap:10px;align-items:center;font-size:12px}.bartrack{height:8px;background:#263128;border-radius:99px;overflow:hidden}.barfill{height:100%;background:var(--accent);border-radius:99px}.routinegrid,.exercisegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.routine,.exercise{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#111713}.routinebody,.exercisebody{padding:13px}.routine h4,.exercise h4{margin:0 0 5px;font-size:14px}.routine p,.exercise p{margin:0 0 11px;font-size:11px;color:var(--muted)}.routine .heroimg,.exercise .heroimg{height:120px;background:#243128;display:grid;place-items:center;color:var(--accent);font-size:28px;overflow:hidden}.heroimg img{width:100%;height:100%;object-fit:cover}.nutritionbig{font-size:23px;font-weight:850}.macro{height:7px;border-radius:99px;background:#283329;overflow:hidden;margin:9px 0 5px}.macro span{display:block;height:100%;background:var(--accent)}.muted{color:var(--muted)}.tagrow{display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid var(--line);padding:5px 8px;border-radius:9px;font-size:11px;color:var(--muted)}.notice{border:1px solid #4d5031;background:#282b1b;color:#e9e4b2;padding:12px 14px;border-radius:12px;font-size:12px;margin-bottom:14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:#152012;font-weight:800;padding:12px 18px;border-radius:12px;box-shadow:0 8px 30px #0008;z-index:100;display:none;max-width:90vw;font-size:13px}.modalback{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 80px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0}.close{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:9px;padding:7px 10px}.hidden{display:none!important}.footer{font-size:11px;color:var(--muted);text-align:center;padding:24px 0 8px}
@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:4px;padding:7px}.navbtn{white-space:nowrap;width:auto;margin:0;padding:10px}.navbtn span{width:auto;margin-right:6px}.side-note{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.routinegrid,.exercisegrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.app{padding:12px}.topbar{align-items:flex-start}.brand h1{font-size:17px}.brand p{font-size:10px}.logo{width:38px;height:38px}.top-actions .btn{padding:8px 9px;font-size:11px}.pagehead h2{font-size:23px}.two,.three{grid-template-columns:1fr}.routinegrid,.exercisegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}.statvalue{font-size:23px}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.setrow{grid-template-columns:25px repeat(3,minmax(0,1fr)) 30px;gap:4px}.setrow input{font-size:12px;padding:8px 3px}.quickgrid{grid-template-columns:1fr 1fr}.itemactions .btn{padding:6px 7px}.routine .heroimg,.exercise .heroimg{height:90px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">F</div><div><h1>FORGE<span style="color:var(--accent)">FIT</span></h1><p>Your training. Your data. Your progress.</p></div></div>
  <div class="top-actions">
    <button class="btn" id="exportBtn">↗ Backup</button>
    <button class="btn" id="importBtn">↙ Restore</button><input id="importFile" type="file" accept=".json,application/json" class="hidden">
    <button class="btn primary" id="headerWorkoutBtn">＋ Log workout</button>
  </div>
</header>
<div class="layout">
<nav class="sidebar" aria-label="Main navigation">
  <button class="navbtn active" data-page="dashboard"><span>▦</span>Dashboard</button>
  <button class="navbtn" data-page="workouts"><span>🏋</span>Workouts</button>
  <button class="navbtn" data-page="exercises"><span>▧</span>Exercises</button>
  <button class="navbtn" data-page="routines"><span>☷</span>Routines</button>
  <button class="navbtn" data-page="progress"><span>↗</span>Progress</button>
  <button class="navbtn" data-page="nutrition"><span>◉</span>Nutrition</button>
  <button class="navbtn" data-page="measurements"><span>◌</span>Body stats</button>
  <button class="navbtn" data-page="settings"><span>⚙</span>Settings</button>
  <div class="side-note">LOCAL MODE · Saved in this browser</div>
</nav>
<main id="main"></main>
</div>
<div class="footer">FORGEFIT · A personal tracker, not medical advice · Back up your data regularly</div>
</div>
<div class="modalback" id="modalBack"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h3 id="modalTitle">Add item</h3><button class="close" id="modalClose">✕</button></div><div id="modalContent"></div></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
'use strict';
const DB_NAME='ForgeFitDB', DB_VERSION=1, STORE='appState';
let db, state, activePage='dashboard', editingWorkoutId=null, editingExerciseId=null, editingRoutineId=null, editingMealId=null, editingMeasureId=null, editingNutritionId=null;
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0;
const round=(n,d=1)=>Number(n||0).toFixed(d);
const fmtNum=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:1});
function defaultState(){return {version:1,profile:{name:'Athlete',goal:'Build muscle & improve fitness',weightUnit:'kg',calorieGoal:2200,proteinGoal:150,waterGoal:2500},exercises:[],workouts:[],routines:[],meals:[],measurements:[],water:[],settings:{}}}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbGet(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbPut(value){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function save(){try{await dbPut(state)}catch(e){console.error(e);toast('Could not save. Export a backup and reduce image sizes.');throw e}}
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2800)}
function modal(title,html){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modalBack').style.display='flex';}
function closeModal(){$('modalBack').style.display='none';$('modalContent').innerHTML=''}
$('modalClose').onclick=closeModal;$('modalBack').addEventListener('click',e=>{if(e.target===$('modalBack'))closeModal()});
function empty(msg){return `<div class="empty">${msg}</div>`}
function card(title,body,action=''){return `<section class="card"><div class="sectiontitle"><h3>${title}</h3>${action}</div>${body}</section>`}
function imgHTML(src,alt='Exercise image'){return src?`<img src="${src}" alt="${esc(alt)}">`:'🏋️'}
function sumVolume(w){return (w.exercises||[]).reduce((s,e)=>s+(e.sets||[]).reduce((ss,set)=>ss+num(set.weight)*num(set.reps),0),0)}
function allSets(){return state.workouts.flatMap(w=>(w.exercises||[]).flatMap(e=>(e.sets||[]).map(s=>({...s,exerciseId:e.exerciseId,exerciseName:e.name,date:w.date,workoutId:w.id}))))}
function exerciseName(id){return state.exercises.find(e=>e.id===id)?.name||'Custom exercise'}
function workoutLabel(w){return w.name||'Workout'}
function recentWorkouts(limit=5){return [...state.workouts].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0)).slice(0,limit)}
function thisWeekWorkouts(){const now=new Date(),day=(now.getDay()+6)%7,start=new Date(now);start.setDate(now.getDate()-day);start.setHours(0,0,0,0);const iso=start.toISOString().slice(0,10);return state.workouts.filter(w=>w.date>=iso)}
function dateRange(days){const arr=[];for(let i=days-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);arr.push(d.toISOString().slice(0,10))}return arr}
function drawLine(canvas,labels,values,label){if(!canvas)return;const ctx=canvas.getContext('2d'),w=canvas.clientWidth||320,h=canvas.clientHeight||220,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const pad={l:35,r:10,t:18,b:30},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;ctx.strokeStyle='#2a382d';ctx.fillStyle='#9cad9f';ctx.lineWidth=1;ctx.font='10px system-ui';for(let i=0;i<4;i++){let y=pad.t+ch*i/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke()}const max=Math.max(...values,1)*1.12,min=Math.min(...values,0),range=max-min||1;values.forEach((v,i)=>{const x=pad.l+(labels.length===1?cw/2:cw*i/(labels.length-1)),y=pad.t+ch-(v-min)/range*ch; if(i===0)ctx.beginPath(),ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.strokeStyle='#b8f36b';ctx.lineWidth=2.5;ctx.stroke();values.forEach((v,i)=>{const x=pad.l+(labels.length===1?cw/2:cw*i/(labels.length-1)),y=pad.t+ch-(v-min)/range*ch;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='#b8f36b';ctx.fill();if(labels.length<=8||i%Math.ceil(labels.length/6)===0){ctx.fillStyle='#9cad9f';ctx.textAlign='center';ctx.fillText(labels[i],x,h-9)}});ctx.textAlign='left';ctx.fillStyle='#edf5ee';ctx.fillText(label,8,11)}
function render(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));const pages={dashboard:renderDashboard,workouts:renderWorkouts,exercises:renderExercises,routines:renderRoutines,progress:renderProgress,nutrition:renderNutrition,measurements:renderMeasurements,settings:renderSettings};$('main').innerHTML=(pages[activePage]||renderDashboard)();bindPage();if(activePage==='dashboard')requestAnimationFrame(drawDashboardCharts);if(activePage==='progress')requestAnimationFrame(drawProgressCharts)}
function pageHead(title,sub,button=''){return `<div class="pagehead"><div><div class="eyebrow">YOUR FITNESS SPACE</div><h2>${title}</h2><p>${sub}</p></div>${button}</div>`}
function renderDashboard(){
const week=thisWeekWorkouts(),vol=week.reduce((s,w)=>s+sumVolume(w),0),meals=state.meals.filter(m=>m.date===today()),cal=meals.reduce((s,m)=>s+num(m.calories),0),protein=meals.reduce((s,m)=>s+num(m.protein),0),latest=recentWorkouts(4),weight=state.measurements.filter(m=>m.weight).sort((a,b)=>a.date.localeCompare(b.date)).at(-1);
return `${pageHead('Dashboard','A clear view of your training and recovery.',`<button class="btn primary" data-action="new-workout">＋ Log workout</button>`)}
<div class="grid stats">
<div class="card"><span class="staticon">↗</span><div class="statlabel">Workouts this week</div><div class="statvalue">${week.length}</div><div class="statfoot">Training consistency</div></div>
<div class="card"><span class="staticon">⚒</span><div class="statlabel">Volume this week</div><div class="statvalue">${fmtNum(vol)}</div><div class="statfoot">kg × reps · logged sets</div></div>
<div class="card"><span class="staticon">◉</span><div class="statlabel">Calories today</div><div class="statvalue">${fmtNum(cal)}</div><div class="statfoot">Goal ${fmtNum(state.profile.calorieGoal)} kcal</div></div>
<div class="card"><span class="staticon">⚖</span><div class="statlabel">Latest body weight</div><div class="statvalue">${weight?fmtNum(weight.weight):'—'}<span style="font-size:13px;color:var(--muted)"> ${weight?'kg':''}</span></div><div class="statfoot">${weight?fmtDate(weight.date):'Add a body measurement'}</div></div>
</div>
<div class="grid two">
${card('Training volume · last 7 days',`<div class="chartbox"><canvas id="dashVolume"></canvas></div>`)}
${card('Quick actions',`<div class="quickgrid"><button class="quick" data-action="new-workout"><b>＋ Log workout</b><small>Record sets, reps & weight</small></button><button class="quick" data-action="new-exercise"><b>▧ Add exercise</b><small>Include your own photo</small></button><button class="quick" data-action="new-meal"><b>◉ Log nutrition</b><small>Calories & macros</small></button><button class="quick" data-action="new-measure"><b>⚖ Body stats</b><small>Weight & measurements</small></button></div>`)}
</div>
<div style="height:14px"></div><div class="grid two">
${card('Recent workouts',`<div class="itemlist">${latest.length?latest.map(w=>`<div class="listitem"><div class="thumb">🏋️</div><div class="itemmain"><b>${esc(workoutLabel(w))}</b><small>${fmtDate(w.date)} · ${(w.exercises||[]).length} exercises · ${fmtNum(sumVolume(w))} kg volume</small></div><button class="btn small" data-action="edit-workout" data-id="${w.id}">View</button></div>`).join(''):empty('No workouts logged yet. Start with your first session.')}</div><div style="margin-top:12px"><button class="btn" data-page="workouts">View workout history →</button></div>`)}
${card('Today’s nutrition',`<div class="nutritionbig">${fmtNum(cal)} <span class="muted" style="font-size:12px;font-weight:500">/ ${fmtNum(state.profile.calorieGoal)} kcal</span></div><div class="macro"><span style="width:${Math.min(100,cal/Math.max(1,state.profile.calorieGoal)*100)}%"></span></div><div class="tagrow"><span class="tag">Protein ${fmtNum(protein)} g</span><span class="tag">Carbs ${fmtNum(meals.reduce((s,m)=>s+num(m.carbs),0))} g</span><span class="tag">Fat ${fmtNum(meals.reduce((s,m)=>s+num(m.fat),0))} g</span></div><div style="margin-top:14px"><button class="btn" data-action="new-meal">＋ Add food</button> <button class="btn" data-page="nutrition">Nutrition details</button></div>`)}
</div>`;
}
function drawDashboardCharts(){const dates=dateRange(7),vals=dates.map(d=>state.workouts.filter(w=>w.date===d).reduce((s,w)=>s+sumVolume(w),0));drawLine($('dashVolume'),dates.map(d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})),vals,'kg × reps')}
function renderWorkouts(){const list=recentWorkouts(200);return `${pageHead('Workout log','Record sessions and review every exercise.',`<button class="btn primary" data-action="new-workout">＋ New workout</button>`)}
<div class="card"><div class="sectiontitle"><h3>Workout history</h3><small>${state.workouts.length} sessions</small></div>${list.length?`<div class="itemlist">${list.map(w=>`<div class="listitem"><div class="thumb">🏋️</div><div class="itemmain"><b>${esc(workoutLabel(w))}</b><small>${fmtDate(w.date)} · ${(w.exercises||[]).length} exercises · ${fmtNum(sumVolume(w))} kg volume${w.duration?` · ${w.duration} min`:''}</small>${w.notes?`<small>${esc(w.notes)}</small>`:''}</div><div class="itemactions"><button class="btn small" data-action="edit-workout" data-id="${w.id}">Edit</button><button class="btn small danger" data-action="delete-workout" data-id="${w.id}">Delete</button></div></div>`).join('')}</div>`:empty('No workouts yet. Tap “New workout” to log your first session.')}</div>`}
function renderExercises(){return `${pageHead('Exercise library','Build your own library and attach exercise images.',`<button class="btn primary" data-action="new-exercise">＋ Add exercise</button>`)}
<div class="notice">Tip: upload a photo you own or have permission to use. Images are stored locally in this browser and included in your JSON backup.</div>
${state.exercises.length?`<div class="exercisegrid">${state.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<article class="exercise"><div class="heroimg">${imgHTML(e.image,e.name)}</div><div class="exercisebody"><h4>${esc(e.name)}</h4><p>${esc(e.muscle||'Other')} · ${esc(e.equipment||'No equipment specified')}</p>${e.notes?`<p>${esc(e.notes)}</p>`:''}<div class="itemactions" style="justify-content:start"><button class="btn small" data-action="edit-exercise" data-id="${e.id}">Edit</button><button class="btn small danger" data-action="delete-exercise" data-id="${e.id}">Delete</button></div></div></article>`).join('')}</div>`:empty('Your exercise library is empty. Add an exercise with a name, muscle group, and optional photo.')}` }

function renderProgress(){const prs=personalRecords();return `${pageHead('Progress & records','See strength trends and your best logged sets.')}
<div class="grid stats"><div class="card"><div class="statlabel">Total workouts</div><div class="statvalue">${state.workouts.length}</div><div class="statfoot">All recorded sessions</div></div><div class="card"><div class="statlabel">Total training volume</div><div class="statvalue">${fmtNum(state.workouts.reduce((s,w)=>s+sumVolume(w),0))}</div><div class="statfoot">kg × reps</div></div><div class="card"><div class="statlabel">Exercises tracked</div><div class="statvalue">${new Set(allSets().map(s=>s.exerciseId||s.exerciseName)).size}</div><div class="statfoot">Exercises with logged sets</div></div><div class="card"><div class="statlabel">Personal records</div><div class="statvalue">${prs.length}</div><div class="statfoot">Best weight per exercise</div></div></div>
<div class="grid two">${card('Training volume · last 30 days',`<div class="chartbox"><canvas id="progressVolume"></canvas></div>`)}${card('Body weight trend',`<div class="chartbox"><canvas id="weightChart"></canvas></div>`)}</div>
<div style="height:14px"></div>${card('Personal records',prs.length?`<div class="tablewrap"><table><thead><tr><th>Exercise</th><th>Best weight</th><th>Reps</th><th>Date</th></tr></thead><tbody>${prs.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmtNum(p.weight)} kg</td><td>${p.reps}</td><td>${fmtDate(p.date)}</td></tr>`).join('')}</tbody></table></div>`:empty('Log sets with weights to build your personal records.'))}`}
function personalRecords(){const map=new Map();for(const s of allSets()){const key=s.exerciseId||s.exerciseName;if(!map.has(key)||num(s.weight)>num(map.get(key).weight))map.set(key,{name:s.exerciseName,weight:num(s.weight),reps:num(s.reps),date:s.date})}return [...map.values()].filter(p=>p.weight>0).sort((a,b)=>b.weight-a.weight)}
function drawProgressCharts(){const ds=dateRange(30),vals=ds.map(d=>state.workouts.filter(w=>w.date===d).reduce((s,w)=>s+sumVolume(w),0));drawLine($('progressVolume'),ds.map((d,i)=>i%5===0?d.slice(5):''),vals,'kg × reps');const ms=state.measurements.filter(m=>m.weight).sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);drawLine($('weightChart'),ms.map(m=>m.date.slice(5)),ms.map(m=>num(m.weight)),'kg')}
function renderNutrition(){
const todayMeals=state.meals.filter(m=>m.date===today());
const sum=(key)=>todayMeals.reduce((s,m)=>s+num(m[key]),0);
const water=state.water.filter(w=>w.date===today()).reduce((s,w)=>s+num(w.ml),0);
const todayFood=todayMeals.length?`<div class="itemlist">${todayMeals.map(m=>`<div class="listitem"><div class="thumb">◉</div><div class="itemmain"><b>${esc(m.name)}</b><small>${fmtNum(m.calories)} kcal · P ${fmtNum(m.protein)} g · C ${fmtNum(m.carbs)} g · F ${fmtNum(m.fat)} g</small></div><div class="itemactions"><button class="btn small" data-action="edit-meal" data-id="${m.id}">Edit</button><button class="btn small danger" data-action="delete-meal" data-id="${m.id}">Delete</button></div></div>`).join('')}</div>`:empty('No food logged today. Add foods and enter their nutrition values.');
const history=state.meals.length?`<div class="itemlist">${[...state.meals].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(m=>`<div class="listitem"><div class="itemmain"><b>${esc(m.name)}</b><small>${fmtDate(m.date)} · ${fmtNum(m.calories)} kcal · ${fmtNum(m.protein)} g protein</small></div>${m.date!==today()?`<span class="pill">${esc(m.date)}</span>`:''}</div>`).join('')}</div>`:empty('Your food history will appear here.');
return `${pageHead('Nutrition','Track food, macros and water. Values are entered by you.',`<button class="btn primary" data-action="new-meal">＋ Log food</button>`)}
<div class="grid stats"><div class="card"><div class="statlabel">Calories today</div><div class="statvalue">${fmtNum(sum('calories'))}</div><div class="statfoot">Goal ${fmtNum(state.profile.calorieGoal)} kcal</div><div class="macro"><span style="width:${Math.min(100,sum('calories')/Math.max(1,state.profile.calorieGoal)*100)}%"></span></div></div><div class="card"><div class="statlabel">Protein</div><div class="statvalue">${fmtNum(sum('protein'))} g</div><div class="statfoot">Goal ${fmtNum(state.profile.proteinGoal)} g</div><div class="macro"><span style="width:${Math.min(100,sum('protein')/Math.max(1,state.profile.proteinGoal)*100)}%"></span></div></div><div class="card"><div class="statlabel">Water today</div><div class="statvalue">${fmtNum(water)} ml</div><div class="statfoot">Goal ${fmtNum(state.profile.waterGoal)} ml</div><div class="macro"><span style="width:${Math.min(100,water/Math.max(1,state.profile.waterGoal)*100)}%"></span></div></div><div class="card"><div class="statlabel">Meals today</div><div class="statvalue">${todayMeals.length}</div><div class="statfoot">Food entries logged</div><button class="btn small" data-action="add-water" style="margin-top:8px">＋ Add 250 ml water</button></div></div>
<div class="grid two">${card('Today’s food log',todayFood)}${card('Nutrition history',history)}</div>`
}
function renderMeasurements(){const list=[...state.measurements].sort((a,b)=>b.date.localeCompare(a.date));const latest=list[0];return `${pageHead('Body stats','Record body weight and measurements over time.',`<button class="btn primary" data-action="new-measure">＋ Add measurement</button>`)}

function renderSettings(){return `${pageHead('Settings & data','Manage your profile and protect your local data.')}
<div class="grid two">${card('Profile & goals',`<form id="profileForm"><div class="formgrid"><div class="field full"><label for="profileName">Name / nickname</label><input id="profileName" value="${esc(state.profile.name)}" maxlength="60"></div><div class="field full"><label for="profileGoal">Fitness goal</label><input id="profileGoal" value="${esc(state.profile.goal)}" maxlength="120"></div><div class="field"><label for="calorieGoal">Daily calorie goal (kcal)</label><input id="calorieGoal" type="number" min="0" max="20000" value="${num(state.profile.calorieGoal)}"></div><div class="field"><label for="proteinGoal">Daily protein goal (g)</label><input id="proteinGoal" type="number" min="0" max="1000" value="${num(state.profile.proteinGoal)}"></div><div class="field"><label for="waterGoal">Daily water goal (ml)</label><input id="waterGoal" type="number" min="0" max="20000" value="${num(state.profile.waterGoal)}"></div></div><div class="form-actions"><button class="btn primary" type="submit">Save profile</button></div></form>`)}${card('Backup & restore',`<p class="muted" style="font-size:13px">Export a JSON backup before clearing browser data or changing devices. Backups include your records and exercise images.</p><div class="itemlist"><button class="btn" id="settingsExport">↗ Export complete backup</button><button class="btn" id="settingsImport">↙ Restore from backup</button><button class="btn danger" id="clearAll">Delete all app data</button></div><p class="hint">Restoring a backup replaces the current app data. Keep a copy of your current backup first.</p>`)}
</div><div style="height:14px"></div>${card('About local storage',`<p class="muted" style="font-size:13px">ForgeFit saves data in this browser using IndexedDB. It is not an online account, and there is no automatic cloud sync. Private browsing, clearing site data, browser resets, or device loss can remove records. Export backups regularly.</p><p class="muted" style="font-size:13px">Nutrition values are manually entered and may be inaccurate. Training suggestions and tracking are for general fitness use, not medical advice.</p>`)}`}
function setPage(p){activePage=p;render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
$('headerWorkoutBtn').onclick=()=>openWorkoutForm();$('exportBtn').onclick=exportBackup;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=importBackup;
function bindPage(){document.querySelectorAll('[data-page]').forEach(b=>{if(!b.classList.contains('navbtn'))b.onclick=()=>setPage(b.dataset.page)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));
const pf=$('profileForm');if(pf)pf.onsubmit=async e=>{e.preventDefault();state.profile.name=$('profileName').value.trim()||'Athlete';state.profile.goal=$('profileGoal').value.trim();state.profile.calorieGoal=Math.max(0,num($('calorieGoal').value));state.profile.proteinGoal=Math.max(0,num($('proteinGoal').value));state.profile.waterGoal=Math.max(0,num($('waterGoal').value));await save();toast('Profile saved');render()};
if($('settingsExport'))$('settingsExport').onclick=exportBackup;if($('settingsImport'))$('settingsImport').onclick=()=>$('importFile').click();if($('clearAll'))$('clearAll').onclick=async()=>{if(confirm('Permanently delete all ForgeFit records from this browser? Export a backup first.')){state=defaultState();await save();toast('All app data deleted');render()}}
}
function action(a,id){switch(a){
case'new-workout':openWorkoutForm();break;case'edit-workout':openWorkoutForm(id);break;case'delete-workout':deleteWorkout(id);break;
case'new-exercise':openExerciseForm();break;case'edit-exercise':openExerciseForm(id);break;case'delete-exercise':deleteExercise(id);break;
case'new-routine':openRoutineForm();break;case'edit-routine':openRoutineForm(id);break;case'delete-routine':deleteRoutine(id);break;case'start-routine':startRoutine(id);break;
case'new-meal':openMealForm();break;case'edit-meal':openMealForm(id);break;case'delete-meal':deleteMeal(id);break;
case'new-measure':openMeasureForm();break;case'edit-measure':openMeasureForm(id);break;case'delete-measure':deleteMeasure(id);break;
case'add-water':addWater();break;
}}
function exerciseOptions(selected=''){return state.exercises.map(e=>`<option value="${e.id}" ${e.id===selected?'selected':''}>${esc(e.name)}</option>`).join('')}
function openWorkoutForm(id=null, routine=null){editingWorkoutId=id;const old=id?state.workouts.find(w=>w.id===id):null;const initial=routine?routine.exerciseIds.map(eid=>({exerciseId:eid,name:exerciseName(eid),sets:[{weight:0,reps:10}] })):old?JSON.parse(JSON.stringify(old.exercises||[])):[];
modal(id?'Edit workout':'Log a workout',`<form id="workoutForm"><div class="formgrid"><div class="field"><label for="wName">Workout name</label><input id="wName" required maxlength="100" placeholder="e.g. Push day" value="${esc(old?.name||routine?.name||'')}"></div><div class="field"><label for="wDate">Date</label><input id="wDate" type="date" required value="${esc(old?.date||today())}"></div><div class="field"><label for="wDuration">Duration (minutes)</label><input id="wDuration" type="number" min="0" max="1440" value="${num(old?.duration)}"></div><div class="field"><label for="wMood">Effort / energy (optional)</label><select id="wMood"><option value="">Not recorded</option>${['Easy','Moderate','Hard','Very hard'].map(x=>`<option ${old?.effort===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label for="wNotes">Notes (optional)</label><textarea id="wNotes" maxlength="2000" placeholder="How did the session feel?">${esc(old?.notes||'')}</textarea></div></div>
<div style="height:18px"></div><div class="sectiontitle"><h3>Exercises & sets</h3><small id="exerciseCount"></small></div><div id="workoutExercises"></div><div class="formgrid" style="margin-top:10px"><div class="field"><label for="addExerciseSelect">Add from your library</label><select id="addExerciseSelect"><option value="">Choose exercise…</option>${exerciseOptions()}</select></div><div class="field" style="align-self:end"><button class="btn" type="button" id="addExerciseBtn">＋ Add exercise</button> <button class="btn" type="button" id="quickExerciseBtn">＋ Create new</button></div></div><div class="form-actions"><button type="button" class="btn" id="cancelWorkout">Cancel</button><button type="submit" class="btn primary">Save workout</button></div></form>`);
const list=$('workoutExercises');let items=initial;
function renderRows(){list.innerHTML=items.length?items.map((e,i)=>`<div class="card" style="padding:12px;margin-bottom:10px" data-exindex="${i}"><div class="sectiontitle"><h3>${esc(e.name||exerciseName(e.exerciseId))}</h3><button class="btn small danger" type="button" data-remove-ex="${i}">Remove</button></div><div class="setrow" style="color:var(--muted);font-size:10px"><span>SET</span><span>WEIGHT (kg)</span><span>REPS</span><span>RPE*</span><span></span></div><div class="setrows">${(e.sets||[]).map((s,j)=>`<div class="setrow"><span class="setnum">${j+1}</span><input type="number" min="0" step="0.25" placeholder="kg" aria-label="Set ${j+1} weight" data-setfield="weight" data-e="${i}" data-s="${j}" value="${esc(s.weight??0)}"><input type="number" min="0" max="1000" placeholder="reps" aria-label="Set ${j+1} reps" data-setfield="reps" data-e="${i}" data-s="${j}" value="${esc(s.reps??10)}"><input type="number" min="1" max="10" placeholder="1-10" aria-label="Set ${j+1} effort" data-setfield="rpe" data-e="${i}" data-s="${j}" value="${esc(s.rpe??'')}"><button type="button" class="remove-set" data-remove-set="${i},${j}" aria-label="Remove set">×</button></div>`).join('')}</div><button class="btn small" type="button" data-add-set="${i}">＋ Add set</button></div>`).join(''):empty('Add an exercise to begin logging sets.');$('exerciseCount').textContent=`${items.length} exercises`;
list.querySelectorAll('[data-remove-ex]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.removeEx,1);renderRows()});
list.querySelectorAll('[data-add-set]').forEach(b=>b.onclick=()=>{syncInputs();items[+b.dataset.addSet].sets.push({weight:0,reps:10});renderRows()});
list.querySelectorAll('[data-remove-set]').forEach(b=>b.onclick=()=>{syncInputs();const [i,j]=b.dataset.removeSet.split(',').map(Number);items[i].sets.splice(j,1);renderRows()});
list.querySelectorAll('[data-setfield]').forEach(inp=>inp.onchange=()=>{const i=+inp.dataset.e,j=+inp.dataset.s,f=inp.dataset.setfield;items[i].sets[j][f]=inp.value===''?'':num(inp.value)});
}
function syncInputs(){list.querySelectorAll('[data-setfield]').forEach(inp=>{const i=+inp.dataset.e,j=+inp.dataset.s,f=inp.dataset.setfield;if(items[i]?.sets[j])items[i].sets[j][f]=inp.value===''?'':num(inp.value)})}
renderRows();$('addExerciseBtn').onclick=()=>{const eid=$('addExerciseSelect').value;if(!eid){toast('Choose an exercise first');return}if(items.some(e=>e.exerciseId===eid)){toast('That exercise is already in this workout');return}items.push({exerciseId:eid,name:exerciseName(eid),sets:[{weight:0,reps:10}]});renderRows();$('addExerciseSelect').value=''};
$('quickExerciseBtn').onclick=()=>{syncInputs();closeModal();openExerciseForm(null, e=>{items.push({exerciseId:e.id,name:e.name,sets:[{weight:0,reps:10}]});openWorkoutForm(id,{name:$('wName')?.value||old?.name||'',exerciseIds:items.map(x=>x.exerciseId)});})};
$('cancelWorkout').onclick=closeModal;
$('workoutForm').onsubmit=async e=>{e.preventDefault();syncInputs();const record={id:old?.id||uid(),createdAt:old?.createdAt||Date.now(),name:$('wName').value.trim(),date:$('wDate').value,duration:num($('wDuration').value),effort:$('wMood').value,notes:$('wNotes').value.trim(),exercises:items.map(ex=>({...ex,name:ex.name||exerciseName(ex.exerciseId),sets:(ex.sets||[]).map(s=>({weight:num(s.weight),reps:num(s.reps),rpe:s.rpe===''?'':num(s.rpe)}))}))};if(old)state.workouts=state.workouts.map(w=>w.id===id?record:w);else state.workouts.push(record);await save();closeModal();toast('Workout saved');activePage='workouts';render()};
}
function openExerciseForm(id=null,callback=null){editingExerciseId=id;const old=id?state.exercises.find(e=>e.id===id):null;modal(old?'Edit exercise':'Add exercise',`<form id="exerciseForm"><div class="formgrid"><div class="field full"><label for="eName">Exercise name *</label><input id="eName" required maxlength="100" value="${esc(old?.name||'')}" placeholder="e.g. Incline dumbbell press"></div><div class="field"><label for="eMuscle">Muscle group</label><select id="eMuscle">${['Chest','Back','Shoulders','Biceps','Triceps','Legs','Glutes','Core','Cardio','Full body','Other'].map(x=>`<option ${old?.muscle===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="eEquipment">Equipment</label><input id="eEquipment" maxlength="80" value="${esc(old?.equipment||'')}" placeholder="Dumbbell, cable…"></div><div class="field full"><label for="eNotes">Instructions / notes</label><textarea id="eNotes" maxlength="1200" placeholder="Your form cues or reminders">${esc(old?.notes||'')}</textarea></div><div class="field full"><label for="eImage">Exercise photo (optional)</label><input id="eImage" type="file" accept="image/*"><div class="hint">Images are resized to reduce storage. JPG, PNG, WebP and other browser-supported image formats.</div><div id="imagePreview" style="margin-top:10px;max-width:220px;border-radius:12px;overflow:hidden">${old?.image?`<img src="${old.image}" style="width:100%;display:block" alt="Current exercise photo">`:''}</div><label style="margin-top:10px"><input id="eRemoveImage" type="checkbox"> Remove existing photo</label></div></div><div class="form-actions"><button type="button" class="btn" id="cancelExercise">Cancel</button><button type="submit" class="btn primary">Save exercise</button></div></form>`);
let newImage=null;$('eImage').onchange=async()=>{const file=$('eImage').files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Please choose an image file');return}try{newImage=await compressImage(file);$('imagePreview').innerHTML=`<img src="${newImage}" style="width:100%;display:block" alt="Selected photo preview">`}catch(err){toast('Could not read that image')}};
$('cancelExercise').onclick=closeModal;$('exerciseForm').onsubmit=async ev=>{ev.preventDefault();const name=$('eName').value.trim();if(!name)return;const record={id:old?.id||uid(),name,muscle:$('eMuscle').value,equipment:$('eEquipment').value.trim(),notes:$('eNotes').value.trim(),image:$('eRemoveImage').checked?null:(newImage||old?.image||null)};if(old)state.exercises=state.exercises.map(x=>x.id===id?record:x);else state.exercises.push(record);await save();closeModal();toast('Exercise saved');if(callback)callback(record);else render()};
}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.src=reader.result};reader.readAsDataURL(file)})}
async function deleteExercise(id){if(!confirm('Delete this exercise from your library? Existing workout logs keep their saved exercise name, but may no longer show the photo.'))return;const ex=state.exercises.find(e=>e.id===id);state.exercises=state.exercises.filter(e=>e.id!==id);state.routines.forEach(r=>r.exerciseIds=(r.exerciseIds||[]).filter(x=>x!==id));state.workouts.forEach(w=>(w.exercises||[]).forEach(e=>{if(e.exerciseId===id)e.name=e.name||ex?.name||'Deleted exercise'}));await save();toast('Exercise deleted');render()}
function openRoutineForm(id=null){editingRoutineId=id;const old=id?state.routines.find(r=>r.id===id):null;modal(old?'Edit routine':'Create routine',`<form id="routineForm"><div class="field"><label for="rName">Routine name *</label><input id="rName" required maxlength="100" value="${esc(old?.name||'')}" placeholder="e.g. Push day A"></div><div class="field" style="margin-top:12px"><label for="rNotes">Notes</label><textarea id="rNotes" maxlength="1000">${esc(old?.notes||'')}</textarea></div><div style="margin:14px 0 8px"><label>Choose exercises</label></div><div class="itemlist">${state.exercises.length?state.exercises.map(ex=>`<label class="listitem" style="margin:0;color:var(--text)"><input type="checkbox" name="routineExercise" value="${ex.id}" ${(old?.exerciseIds||[]).includes(ex.id)?'checked':''}><span class="itemmain"><b>${esc(ex.name)}</b><small>${esc(ex.muscle||'Other')}</small></span></label>`).join(''):empty('Add exercises to your library first.')}</div><div class="form-actions"><button type="button" class="btn" id="cancelRoutine">Cancel</button><button type="submit" class="btn primary">Save routine</button></div></form>`);
$('cancelRoutine').onclick=closeModal;$('routineForm').onsubmit=async e=>{e.preventDefault();const r={id:old?.id||uid(),name:$('rName').value.trim(),notes:$('rNotes').value.trim(),exerciseIds:[...document.querySelectorAll('[name="routineExercise"]:checked')].map(x=>x.value)};if(old)state.routines=state.routines.map(x=>x.id===id?r:x);else state.routines.push(r);await save();closeModal();toast('Routine saved');render()}}
function startRoutine(id){const r=state.routines.find(x=>x.id===id);if(r)openWorkoutForm(null,r)}
async function deleteRoutine(id){if(!confirm('Delete this routine?'))return;state.routines=state.routines.filter(r=>r.id!==id);await save();toast('Routine deleted');render()}
function openMealForm(id=null){editingMealId=id;const old=id?state.meals.find(m=>m.id===id):null;modal(old?'Edit food entry':'Log food',`<form id="mealForm"><div class="formgrid"><div class="field full"><label for="mName">Food / meal name *</label><input id="mName" required maxlength="120" value="${esc(old?.name||'')}" placeholder="e.g. Paneer, rice and dal"></div><div class="field"><label for="mDate">Date</label><input id="mDate" type="date" required value="${esc(old?.date||today())}"></div><div class="field"><label for="mCalories">Calories (kcal)</label><input id="mCalories" type="number" min="0" max="100000" value="${num(old?.calories)}"></div><div class="field"><label for="mProtein">Protein (g)</label><input id="mProtein" type="number" min="0" step=".1" value="${num(old?.protein)}"></div><div class="field"><label for="mCarbs">Carbs (g)</label><input id="mCarbs" type="number" min="0" step=".1" value="${num(old?.carbs)}"></div><div class="field"><label for="mFat">Fat (g)</label><input id="mFat" type="number" min="0" step=".1" value="${num(old?.fat)}"></div><div class="field"><label for="mFiber">Fiber (g)</label><input id="mFiber" type="number" min="0" step=".1" value="${num(old?.fiber)}"></div><div class="field full"><label for="mNotes">Notes / serving size</label><textarea id="mNotes" maxlength="500">${esc(old?.notes||'')}</textarea></div></div><p class="hint">Enter values from a food label or trusted nutrition source. The app does not estimate nutrition automatically.</p><div class="form-actions"><button type="button" class="btn" id="cancelMeal">Cancel</button><button class="btn primary" type="submit">Save food</button></div></form>`);
$('cancelMeal').onclick=closeModal;$('mealForm').onsubmit=async e=>{e.preventDefault();const m={id:old?.id||uid(),name:$('mName').value.trim(),date:$('mDate').value,calories:num($('mCalories').value),protein:num($('mProtein').value),carbs:num($('mCarbs').value),fat:num($('mFat').value),fiber:num($('mFiber').value),notes:$('mNotes').value.trim()};if(old)state.meals=state.meals.map(x=>x.id===id?m:x);else state.meals.push(m);await save();closeModal();toast('Food entry saved');render()}}
async function deleteMeal(id){if(!confirm('Delete this food entry?'))return;state.meals=state.meals.filter(m=>m.id!==id);await save();toast('Food entry deleted');render()}
async function addWater(){state.water.push({id:uid(),date:today(),ml:250});await save();toast('Added 250 ml water');render()}
function openMeasureForm(id=null){editingMeasureId=id;const old=id?state.measurements.find(m=>m.id===id):null;modal(old?'Edit body measurement':'Add body measurement',`<form id="measureForm"><div class="formgrid"><div class="field full"><label for="bDate">Date</label><input id="bDate" type="date" required value="${esc(old?.date||today())}"></div><div class="field"><label for="bWeight">Weight (kg)</label><input id="bWeight" type="number" min="0" max="500" step=".1" value="${old?.weight??''}" placeholder="e.g. 88"></div><div class="field"><label for="bHeight">Height (cm)</label><input id="bHeight" type="number" min="0" max="300" step=".1" value="${old?.height??''}"></div><div class="field"><label for="bWaist">Waist (cm)</label><input id="bWaist" type="number" min="0" max="300" step=".1" value="${old?.waist??''}"></div><div class="field"><label for="bChest">Chest (cm)</label><input id="bChest" type="number" min="0" max="300" step=".1" value="${old?.chest??''}"></div><div class="field"><label for="bArms">Arms (cm)</label><input id="bArms" type="number" min="0" max="150" step=".1" value="${old?.arms??''}"></div><div class="field"><label for="bThigh">Thigh (cm)</label><input id="bThigh" type="number" min="0" max="200" step=".1" value="${old?.thigh??''}"></div><div class="field"><label for="bBodyFat">Body fat % (optional)</label><input id="bBodyFat" type="number" min="0" max="80" step=".1" value="${old?.bodyFat??''}"></div><div class="field full"><label for="bNotes">Notes</label><textarea id="bNotes" maxlength="500">${esc(old?.notes||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn" id="cancelMeasure">Cancel</button><button type="submit" class="btn primary">Save measurement</button></div></form>`);
$('cancelMeasure').onclick=closeModal;$('measureForm').onsubmit=async e=>{e.preventDefault();const val=id=>$(id).value===''?null:num($(id).value);const m={id:old?.id||uid(),date:$('bDate').value,weight:val('bWeight'),height:val('bHeight'),waist:val('bWaist'),chest:val('bChest'),arms:val('bArms'),thigh:val('bThigh'),bodyFat:val('bBodyFat'),notes:$('bNotes').value.trim()};if(old)state.measurements=state.measurements.map(x=>x.id===id?m:x);else state.measurements.push(m);await save();closeModal();toast('Measurement saved');render()}}
async function deleteMeasure(id){if(!confirm('Delete this body measurement?'))return;state.measurements=state.measurements.filter(m=>m.id!==id);await save();toast('Measurement deleted');render()}
async function deleteWorkout(id){if(!confirm('Delete this workout and its logged sets?'))return;state.workouts=state.workouts.filter(w=>w.id!==id);await save();toast('Workout deleted');render()}
function exportBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),app:'ForgeFit'},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`forgefit-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Backup exported')}
function importBackup(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||!Array.isArray(parsed.workouts)||!Array.isArray(parsed.exercises)||!Array.isArray(parsed.meals))throw new Error('This does not look like a ForgeFit backup');if(!confirm('Restore this backup? It will replace all current ForgeFit data in this browser. Export your current data first if you need it.'))return;const base=defaultState();state={...base,...parsed,profile:{...base.profile,...parsed.profile},settings:parsed.settings||{}};delete state.exportedAt;delete state.app;await save();toast('Backup restored');activePage='dashboard';render()}catch(err){alert('Could not restore backup: '+err.message)}finally{$('importFile').value=''}};reader.readAsText(file)}
async function init(){try{db=await openDB();state=await dbGet()||defaultState();if(!state.profile)state={...defaultState(),...state,profile:{...defaultState().profile,...(state.profile||{})}};await save();render()}catch(e){console.error(e);$('main').innerHTML=`<div class="notice">This browser could not open local storage. Try a recent version of Chrome, Edge, Safari or Firefox, and avoid private/incognito mode.</div>`}}
window.addEventListener('resize',()=>{if(activePage==='dashboard')drawDashboardCharts();if(activePage==='progress')drawProgressCharts()});
init();
})();
</script>
</body>
</html>
